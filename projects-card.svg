<g class="l" style="animation-delay:0.75s"><text x="28" y="96" font-size="15" font-weight="700" fill="#69f0a0">kira</text><text x="78" y="96" font-size="12" fill="#8b949e">Embedded · public</text><text x="832" y="96" text-anchor="end" font-size="12" fill="#8b949e">github.com/Przz23/kira</text><text x="28" y="118" font-size="13" fill="#c9d1d9">Autonomous voice-AI assistant robot on ESP32-S3: C firmware, I2S audio, round SPI display, custom</text><text x="28" y="138" font-size="13" fill="#c9d1d9">PCB and 3D-printed body.</text><rect x="28" y="155" width="77" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="67" y="169" text-anchor="middle" font-size="11" fill="#c9d1d9">ESP32-S3</text><rect x="113" y="155" width="25" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="126" y="169" text-anchor="middle" font-size="11" fill="#c9d1d9">C</text><rect x="147" y="155" width="40" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="167" y="169" text-anchor="middle" font-size="11" fill="#c9d1d9">I2S</text><rect x="195" y="155" width="40" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="215" y="169" text-anchor="middle" font-size="11" fill="#c9d1d9">SPI</text><rect x="243" y="155" width="55" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="270" y="169" text-anchor="middle" font-size="11" fill="#c9d1d9">KiCad</text></g>
