<g class="l" style="animation-delay:1.20s"><text x="28" y="216" font-size="15" font-weight="700" fill="#69f0a0">second-brain</text><text x="150" y="216" font-size="12" fill="#8b949e">Desktop · public</text><text x="832" y="216" text-anchor="end" font-size="12" fill="#8b949e">github.com/Przz23/second-brain</text><text x="28" y="238" font-size="13" fill="#c9d1d9">Local-first Windows app for notes, tasks, documents and project repos, with a private AI chat</text><text x="28" y="258" font-size="13" fill="#c9d1d9">running locally on Qwen3 8B via Ollama. Installer on GitHub Releases.</text><rect x="28" y="275" width="55" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="56" y="289" text-anchor="middle" font-size="11" fill="#c9d1d9">Tauri</text><rect x="91" y="275" width="48" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="115" y="289" text-anchor="middle" font-size="11" fill="#c9d1d9">Rust</text><rect x="147" y="275" width="55" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="174" y="289" text-anchor="middle" font-size="11" fill="#c9d1d9">React</text><rect x="210" y="275" width="62" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="241" y="289" text-anchor="middle" font-size="11" fill="#c9d1d9">SQLite</text><rect x="280" y="275" width="62" height="20" rx="10" fill="#161b22" stroke="#30363d"/><text x="311" y="289" text-anchor="middle" font-size="11" fill="#c9d1d9">Ollama</text></g>
