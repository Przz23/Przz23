name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write # only needed to commit the regenerated files

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch contributions and render heatmap
        working-directory: scripts
        env:
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python fetch_contributions.py
          python render_heatmap_svg.py

      - name: Commit only if something changed
        run: |
          if git diff --quiet -- data/contributions.json contrib-heatmap.svg; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          git commit -m "chore: update contribution heatmap [skip ci]"
          git push
